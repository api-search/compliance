name: APIs.io Compliance
description: "The attestations each provider states on its own trust page: SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP and more, quoted from their own pages."
image: https://apis.io/assets/branding/apisio-social-card.png
url: https://apis.io
node: website
nav_active: compliance

keywords:
  - APIs
  - Search
  - Discovery
  - Compliance
  - OSCAL
  - CSA STAR

exclude: [".rvmrc", ".rbenv-version", "README.md", "Rakefile", "changelog.md", "scripts"]
include: [".well-known"]

github_org: api-search
github_repo: compliance

collections:
  compliance:
    output: true
    permalink: /compliance/:path/

defaults:
  - scope:
      path: ""
      type: compliance
    values:
      layout: compliance
